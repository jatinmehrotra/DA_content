name: Deploy PR Environment

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'Blog/dynamic-pr-environment/**'

permissions:
  id-token: write    # Required for GitHub OIDC → AWS
  contents: read
  pull-requests: write  # Required to post PR comment

env:
  AWS_REGION: us-east-1
  IMAGE_NAME: pr-env-app-pr${{ github.event.number }}
  DYNAMODB_TABLE: pr-environments

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Blog/dynamic-pr-environment
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Terraform outputs
        id: tf
        run: |
          # Read from Terraform state or secrets — using secrets for simplicity
          echo "s3_bucket=${{ secrets.S3_BUCKET }}" >> $GITHUB_OUTPUT
          echo "build_role_arn=${{ secrets.MICROVM_BUILD_ROLE_ARN }}" >> $GITHUB_OUTPUT
          echo "execution_role_arn=${{ secrets.MICROVM_EXECUTION_ROLE_ARN }}" >> $GITHUB_OUTPUT
          echo "proxy_url=${{ secrets.PROXY_URL }}" >> $GITHUB_OUTPUT

      - name: Package MicroVM image code
        run: |
          cd microvm-image
          zip -r ../app-code.zip Dockerfile app.py requirements.txt
          cd ..

      - name: Upload artifact to S3
        run: |
          aws s3 cp app-code.zip s3://${{ steps.tf.outputs.s3_bucket }}/pr-${{ github.event.number }}/app-code.zip

      - name: Get account ID and image ARN
        id: aws
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "image_arn=arn:aws:lambda:${{ env.AWS_REGION }}:${ACCOUNT_ID}:microvm-image:${{ env.IMAGE_NAME }}" >> $GITHUB_OUTPUT

      - name: Create or Update MicroVM Image
        id: image
        run: |
          IMAGE_ARN="${{ steps.aws.outputs.image_arn }}"
          S3_URI="s3://${{ steps.tf.outputs.s3_bucket }}/pr-${{ github.event.number }}/app-code.zip"
          BASE_IMAGE="arn:aws:lambda:${{ env.AWS_REGION }}:aws:microvm-image:al2023-1"
          BUILD_ROLE="${{ steps.tf.outputs.build_role_arn }}"
          HOOKS='{"port":9000,"microvmImageHooks":{"ready":"ENABLED"},"microvmHooks":{"run":"ENABLED","resume":"ENABLED","suspend":"ENABLED","terminate":"ENABLED"}}'

          # Check if image exists
          if aws lambda-microvms get-microvm-image --image-identifier $IMAGE_ARN --region ${{ env.AWS_REGION }} 2>/dev/null; then
            echo "Updating existing image (new version)..."
            aws lambda-microvms update-microvm-image \
              --image-identifier $IMAGE_ARN \
              --code-artifact uri=$S3_URI \
              --base-image-arn $BASE_IMAGE \
              --build-role-arn $BUILD_ROLE \
              --hooks "$HOOKS" \
              --region ${{ env.AWS_REGION }}
          else
            echo "Creating new image..."
            aws lambda-microvms create-microvm-image \
              --name ${{ env.IMAGE_NAME }} \
              --code-artifact uri=$S3_URI \
              --base-image-arn $BASE_IMAGE \
              --build-role-arn $BUILD_ROLE \
              --hooks "$HOOKS" \
              --region ${{ env.AWS_REGION }}
          fi

      - name: Wait for image build to succeed
        run: |
          IMAGE_ARN="${{ steps.aws.outputs.image_arn }}"
          echo "Waiting for image build..."
          for i in $(seq 1 60); do
            STATE=$(aws lambda-microvms get-microvm-image \
              --image-identifier $IMAGE_ARN \
              --region ${{ env.AWS_REGION }} \
              --query 'state' --output text 2>/dev/null || echo "UNKNOWN")
            echo "  Attempt $i: state=$STATE"
            if [ "$STATE" = "CREATED" ] || [ "$STATE" = "UPDATED" ]; then
              echo "✅ Image ready"
              break
            fi
            if [ "$STATE" = "CREATE_FAILED" ] || [ "$STATE" = "FAILED" ] || [ "$STATE" = "UPDATE_FAILED" ]; then
              echo "❌ Image build failed"
              exit 1
            fi
            sleep 10
          done

      - name: Terminate existing MicroVM (if any)
        continue-on-error: true
        run: |
          # Look up the MicroVM ID for THIS PR from DynamoDB
          EXISTING=$(aws dynamodb get-item \
            --table-name ${{ env.DYNAMODB_TABLE }} \
            --key "{\"PK\":{\"S\":\"MICROVM#PR${{ github.event.number }}\"},\"SK\":{\"S\":\"MAPPING\"}}" \
            --region ${{ env.AWS_REGION }} \
            --query 'Item.microvm_id.S' --output text 2>/dev/null || echo "None")

          if [ "$EXISTING" != "None" ] && [ "$EXISTING" != "" ]; then
            echo "Terminating MicroVM for PR #${{ github.event.number }}: $EXISTING"
            aws lambda-microvms terminate-microvm --microvm-identifier "$EXISTING" --region ${{ env.AWS_REGION }} || true
            sleep 5
          else
            echo "No existing MicroVM found for PR #${{ github.event.number }}"
          fi

      - name: Run new MicroVM
        id: microvm
        run: |
          IMAGE_ARN="${{ steps.aws.outputs.image_arn }}"
          EXEC_ROLE="${{ steps.tf.outputs.execution_role_arn }}"
          
          # Construct runHookPayload with PR metadata
          PAYLOAD=$(jq -n \
            --arg pr "${{ github.event.number }}" \
            --arg branch "${{ github.head_ref }}" \
            --arg author "${{ github.event.pull_request.user.login }}" \
            --arg table "${{ env.DYNAMODB_TABLE }}" \
            --arg color "#FF9900" \
            '{pr_number: $pr, branch: $branch, author: $author, dynamodb_table: $table, accent_color: $color, cleanup_data: false}')

          RESULT=$(aws lambda-microvms run-microvm \
            --image-identifier $IMAGE_ARN \
            --execution-role-arn $EXEC_ROLE \
            --idle-policy '{"maxIdleDurationSeconds":300,"suspendedDurationSeconds":3600,"autoResumeEnabled":true}' \
            --run-hook-payload "$PAYLOAD" \
            --region ${{ env.AWS_REGION }} \
            --output json)

          MICROVM_ID=$(echo $RESULT | jq -r '.microvmId')
          ENDPOINT=$(echo $RESULT | jq -r '.endpoint')

          echo "microvm_id=$MICROVM_ID" >> $GITHUB_OUTPUT
          echo "endpoint=https://$ENDPOINT" >> $GITHUB_OUTPUT
          echo "🚀 MicroVM: $MICROVM_ID"
          echo "🌐 Endpoint: https://$ENDPOINT"

      - name: Store PR-to-MicroVM mapping
        run: |
          MICROVM_ID="${{ steps.microvm.outputs.microvm_id }}"
          # Store mapping so we can find this PR's MicroVM later (for terminate on next push or PR close)
          aws dynamodb put-item \
            --table-name ${{ env.DYNAMODB_TABLE }} \
            --item "{\"PK\":{\"S\":\"MICROVM#PR${{ github.event.number }}\"},\"SK\":{\"S\":\"MAPPING\"},\"microvm_id\":{\"S\":\"${MICROVM_ID}\"},\"branch\":{\"S\":\"${{ github.head_ref }}\"}}" \
            --region ${{ env.AWS_REGION }}
          echo "📝 Stored PR #${{ github.event.number }} → ${MICROVM_ID} mapping"

      - name: Generate and store access token
        id: token
        run: |
          # Generate a random 32-char token
          ACCESS_TOKEN=$(openssl rand -hex 16)
          MICROVM_ID="${{ steps.microvm.outputs.microvm_id }}"

          # Store token in DynamoDB (keyed by MicroVM ID)
          aws dynamodb put-item \
            --table-name ${{ env.DYNAMODB_TABLE }} \
            --item "{\"PK\":{\"S\":\"TOKEN#${MICROVM_ID}\"},\"SK\":{\"S\":\"ACCESS\"},\"token\":{\"S\":\"${ACCESS_TOKEN}\"},\"pr_number\":{\"S\":\"${{ github.event.number }}\"}}" \
            --region ${{ env.AWS_REGION }}

          echo "access_token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT
          echo "🔑 Access token generated and stored"

      - name: Wait for MicroVM to be RUNNING
        run: |
          MICROVM_ID="${{ steps.microvm.outputs.microvm_id }}"
          echo "Waiting for MicroVM to reach RUNNING..."
          for i in $(seq 1 30); do
            STATE=$(aws lambda-microvms get-microvm \
              --microvm-identifier "$MICROVM_ID" \
              --region ${{ env.AWS_REGION }} \
              --query 'state' --output text)
            echo "  Attempt $i: state=$STATE"
            if [ "$STATE" = "RUNNING" ]; then
              echo "✅ MicroVM is RUNNING"
              break
            fi
            sleep 5
          done

      - name: Post preview URL to PR
        uses: actions/github-script@v7
        with:
          script: |
            const endpoint = '${{ steps.microvm.outputs.endpoint }}';
            const microvmId = '${{ steps.microvm.outputs.microvm_id }}';
            const branch = '${{ github.head_ref }}';
            const proxyUrl = '${{ steps.tf.outputs.proxy_url }}'.replace(/\/$/, '');
            const accessToken = '${{ steps.token.outputs.access_token }}';
            const previewUrl = proxyUrl ? (proxyUrl + '/' + microvmId + '/?token=' + accessToken) : endpoint;

            const body = '## 🚀 PR Environment Ready!\n\n'
              + '**Preview URL:** ' + previewUrl + '\n\n'
              + '| Detail | Value |\n'
              + '|--------|-------|\n'
              + '| Branch | `' + branch + '` |\n'
              + '| MicroVM | `' + microvmId + '` |\n'
              + '| Region | `${{ env.AWS_REGION }}` |\n'
              + '| Auto-suspend | After 5 min idle |\n'
              + '| Auto-resume | On next request |\n\n'
              + '> This environment runs on a Lambda MicroVM. It will auto-suspend when idle and resume instantly when you access it again. Environment is destroyed when the PR is closed.\n\n'
              + '---\n'
              + '*Deployed by [Dynamic PR Environments](https://github.com/${{ github.repository }})*';

            // Find existing bot comment and update, or create new
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(c => c.body.includes('PR Environment Ready'));
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
