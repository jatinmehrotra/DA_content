<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Inter, -apple-system, sans-serif">
  <!-- White background -->
  <rect width="1200" height="600" fill="white"/>
  
  <!-- Title -->
  <text x="600" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#232F3E">Lambda MicroVM Sandbox — Architecture</text>
  
  <!-- ========== LEFT: Your Machine ========== -->
  <rect x="30" y="60" width="300" height="480" rx="12" fill="#F8FBFF" stroke="#147EBA" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="180" y="85" text-anchor="middle" font-size="11" fill="#147EBA" font-weight="600">YOUR MACHINE</text>
  
  <!-- User Icon -->
  <circle cx="70" cy="280" r="16" fill="none" stroke="#232F3E" stroke-width="2"/>
  <circle cx="70" cy="272" r="6" fill="none" stroke="#232F3E" stroke-width="2"/>
  <path d="M54 296 C54 286 86 286 86 296" fill="none" stroke="#232F3E" stroke-width="2"/>
  <text x="70" y="320" text-anchor="middle" font-size="10" fill="#555">User</text>
  
  <!-- Strands Agent Box -->
  <rect x="110" y="120" width="200" height="60" rx="8" fill="white" stroke="#232F3E" stroke-width="1.5"/>
  <text x="210" y="148" text-anchor="middle" font-size="13" font-weight="600" fill="#232F3E">Strands Agent</text>
  <text x="210" y="166" text-anchor="middle" font-size="10" fill="#666">(agent.py)</text>
  
  <!-- Tool: create_sandbox -->
  <rect x="110" y="205" width="200" height="34" rx="6" fill="#FF9900" stroke="none"/>
  <text x="210" y="226" text-anchor="middle" font-size="11" fill="white" font-weight="500">@tool create_sandbox()</text>
  
  <!-- Tool: run_code -->
  <rect x="110" y="255" width="200" height="34" rx="6" fill="#FF9900" stroke="none"/>
  <text x="210" y="276" text-anchor="middle" font-size="11" fill="white" font-weight="500">@tool run_code()</text>
  
  <!-- Tool: destroy_sandbox -->
  <rect x="110" y="305" width="200" height="34" rx="6" fill="#FF9900" stroke="none"/>
  <text x="210" y="326" text-anchor="middle" font-size="11" fill="white" font-weight="500">@tool destroy_sandbox()</text>
  
  <!-- Bedrock -->
  <rect x="120" y="380" width="180" height="50" rx="8" fill="#8C4FFF" stroke="none"/>
  <text x="210" y="403" text-anchor="middle" font-size="11" fill="white" font-weight="500">Amazon Bedrock</text>
  <text x="210" y="419" text-anchor="middle" font-size="10" fill="#E0D0FF">(Claude — LLM reasoning)</text>
  
  <!-- Arrow: User to Agent -->
  <line x1="90" y1="280" x2="108" y2="155" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Arrow: Agent to Bedrock -->
  <path d="M210 180 L210 378" stroke="#8C4FFF" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-purple)"/>
  
  <!-- ========== CENTER: AWS Cloud ========== -->
  <rect x="370" y="60" width="800" height="480" rx="12" fill="#FAFAFA" stroke="#AAB7B8" stroke-width="1.5"/>
  <text x="770" y="85" text-anchor="middle" font-size="11" fill="#232F3E" font-weight="600">AWS CLOUD (us-east-1)</text>
  
  <!-- Lambda Control Plane -->
  <rect x="410" y="180" width="140" height="80" rx="8" fill="white" stroke="#FF9900" stroke-width="1.5"/>
  <text x="480" y="215" text-anchor="middle" font-size="12" font-weight="600" fill="#FF9900">λ</text>
  <text x="480" y="235" text-anchor="middle" font-size="10" fill="#232F3E" font-weight="500">Lambda MicroVMs</text>
  <text x="480" y="250" text-anchor="middle" font-size="9" fill="#666">Control Plane</text>
  
  <!-- S3 -->
  <rect x="410" y="400" width="140" height="50" rx="8" fill="white" stroke="#3F8624" stroke-width="1.5"/>
  <text x="480" y="423" text-anchor="middle" font-size="10" font-weight="500" fill="#3F8624">S3</text>
  <text x="480" y="438" text-anchor="middle" font-size="9" fill="#666">sandbox-code.zip</text>
  
  <!-- CloudWatch -->
  <rect x="410" y="470" width="140" height="50" rx="8" fill="white" stroke="#D13212" stroke-width="1.5"/>
  <text x="480" y="493" text-anchor="middle" font-size="10" font-weight="500" fill="#D13212">CloudWatch</text>
  <text x="480" y="508" text-anchor="middle" font-size="9" fill="#666">Runtime Logs</text>
  
  <!-- ========== RIGHT: Firecracker MicroVM ========== -->
  <rect x="620" y="110" width="510" height="400" rx="10" fill="white" stroke="#D13212" stroke-width="2.5"/>
  <text x="875" y="135" text-anchor="middle" font-size="12" font-weight="700" fill="#D13212">Firecracker MicroVM (per user/session)</text>
  
  <!-- Isolation badge -->
  <rect x="920" y="145" width="180" height="22" rx="4" fill="#FFF3F0" stroke="#D13212" stroke-width="0.5"/>
  <text x="1010" y="160" text-anchor="middle" font-size="9" fill="#D13212">🔒 Own kernel • VM-isolated</text>
  
  <!-- Layer 1: OS -->
  <rect x="650" y="175" width="450" height="42" rx="6" fill="#232F3E"/>
  <text x="875" y="196" text-anchor="middle" font-size="11" fill="white" font-weight="500">Amazon Linux 2023 (aarch64)</text>
  <text x="875" y="210" text-anchor="middle" font-size="9" fill="#AAB7B8">Separate kernel per MicroVM</text>
  
  <!-- Layer 2: Executor -->
  <rect x="650" y="230" width="450" height="42" rx="6" fill="#527FFF"/>
  <text x="875" y="251" text-anchor="middle" font-size="11" fill="white" font-weight="500">executor.py (Flask on :8080)</text>
  <text x="875" y="265" text-anchor="middle" font-size="9" fill="#C8D8FF">Receives code → runs subprocess → returns stdout</text>
  
  <!-- Layer 3: Python -->
  <rect x="650" y="285" width="450" height="42" rx="6" fill="#3776AB"/>
  <text x="875" y="306" text-anchor="middle" font-size="11" fill="white" font-weight="500">Python 3.9 + packages</text>
  <text x="875" y="320" text-anchor="middle" font-size="9" fill="#B8D4F0">pandas • numpy • scikit-learn • matplotlib</text>
  
  <!-- Layer 4: Workspace -->
  <rect x="650" y="340" width="450" height="42" rx="6" fill="#3F8624"/>
  <text x="875" y="361" text-anchor="middle" font-size="11" fill="white" font-weight="500">/workspace (persistent disk)</text>
  <text x="875" y="375" text-anchor="middle" font-size="9" fill="#C8F0B8">Files survive between run_code() calls</text>
  
  <!-- Layer 5: HTTPS Endpoint -->
  <rect x="650" y="395" width="450" height="42" rx="6" fill="#147EBA"/>
  <text x="875" y="416" text-anchor="middle" font-size="11" fill="white" font-weight="500">Dedicated HTTPS Endpoint</text>
  <text x="875" y="430" text-anchor="middle" font-size="9" fill="#B8E0F8">*.lambda-microvm.us-east-1.on.aws</text>
  
  <!-- Feature badges -->
  <rect x="650" y="455" width="130" height="28" rx="5" fill="#FFF8F0" stroke="#FF9900" stroke-width="1"/>
  <text x="715" y="473" text-anchor="middle" font-size="9" fill="#FF9900" font-weight="500">⚡ Sub-second start</text>
  
  <rect x="795" y="455" width="145" height="28" rx="5" fill="#FFF0F0" stroke="#D13212" stroke-width="1"/>
  <text x="867" y="473" text-anchor="middle" font-size="9" fill="#D13212" font-weight="500">💤 Auto suspend/resume</text>
  
  <rect x="955" y="455" width="130" height="28" rx="5" fill="#F0F8FF" stroke="#147EBA" stroke-width="1"/>
  <text x="1020" y="473" text-anchor="middle" font-size="9" fill="#147EBA" font-weight="500">🔑 JWE Auth Token</text>
  
  <!-- ========== ARROWS ========== -->
  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#232F3E"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#FF9900"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#527FFF"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#D13212"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#8C4FFF"/>
    </marker>
  </defs>
  
  <!-- Arrow 1: create_sandbox → Lambda Control Plane -->
  <path d="M310 222 L408 218" stroke="#FF9900" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="355" y="210" text-anchor="middle" font-size="8" fill="#FF9900">run-microvm</text>
  
  <!-- Arrow 2: run_code → MicroVM Executor -->
  <path d="M310 272 L648 251" stroke="#527FFF" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="470" y="257" text-anchor="middle" font-size="8" fill="#527FFF">POST /execute (HTTPS)</text>
  
  <!-- Arrow 3: destroy_sandbox → Lambda Control Plane -->
  <path d="M310 322 L408 240" stroke="#D13212" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="350" y="290" text-anchor="middle" font-size="8" fill="#D13212">terminate-microvm</text>
  
  <!-- Arrow 4: Lambda → MicroVM (manages) -->
  <path d="M550 220 L648 200" stroke="#232F3E" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="595" y="200" text-anchor="middle" font-size="8" fill="#666">manages</text>
  
  <!-- Arrow 5: Lambda → S3 -->
  <line x1="480" y1="260" x2="480" y2="398" stroke="#AAB7B8" stroke-width="1" stroke-dasharray="3 3"/>
  
  <!-- Arrow 6: MicroVM → CloudWatch -->
  <path d="M650 470 L552 490" stroke="#AAB7B8" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <text x="600" y="488" text-anchor="middle" font-size="8" fill="#999">logs</text>
  
  <!-- Step numbers -->
  <circle cx="345" cy="205" r="9" fill="#FF9900"/>
  <text x="345" y="209" text-anchor="middle" font-size="8" fill="white" font-weight="700">1</text>
  
  <circle cx="345" cy="265" r="9" fill="#527FFF"/>
  <text x="345" y="269" text-anchor="middle" font-size="8" fill="white" font-weight="700">2</text>
  
  <circle cx="345" cy="330" r="9" fill="#D13212"/>
  <text x="345" y="334" text-anchor="middle" font-size="8" fill="white" font-weight="700">3</text>
  
</svg>